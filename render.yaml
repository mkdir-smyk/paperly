services:
  - type: web
    name: paperly-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
